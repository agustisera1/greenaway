query GetListingBookings($id: ID!) {
  listing(id: $id) {
    id
    title
    host_id
    bookings {
      id
      created_at
      start_date
      end_date
      guests
      status
      status_reason
      total_price
      refund_amount
      cancelled_by
      guest {
        id
        name
      }
    }
  }
}
