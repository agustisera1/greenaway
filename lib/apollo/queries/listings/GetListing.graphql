query GetListing($id: ID!) {
  listing(id: $id) {
    id
    description
    host_id
    location {
      city
      country
      address
    }
    photos
    price
    review_stats {
      rating_avg
      count
    }
    title
    type
    availability {
      start_date
      end_date
    }
    reviews {
      id
      listing_id
      author_name
      rating
      comment
      host_reply
      created_at
    }
  }
}
