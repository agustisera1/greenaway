query GetChatThread($id: ID!, $from: DateTime) {
  chatThread(id: $id, from: $from) {
    party
    counterpart {
      id
      name
    }
    chat {
      id
      booking_id
      started_at
      guest_id
      host_id
    }
    messages {
      items {
        id
        chat_id
        sender_id
        body
        timestamp
      }
      olderCursor
    }
  }
}
