# A user as their counterparty may see them: no email.
type UserSummary {
  id: ID!
  name: String
}

extend type Booking {
  host: UserSummary
  guest: UserSummary
}

# The other side of the booking, as the viewer sees them.
extend type Conversation {
  counterpart: UserSummary
}

extend type ChatThread {
  counterpart: UserSummary
}
