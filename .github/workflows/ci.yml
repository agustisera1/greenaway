name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next-env.d.ts is gitignored (Next docs: TypeScript); typegen regenerates it for tsc.
      - run: pnpm exec next typegen
        env:
          AWS_S3_ENDPOINT: http://localhost:9000
          AWS_LISTINGS_BUCKET: listings

      - run: pnpm exec tsc --noEmit

      - run: pnpm lint

      - run: pnpm test
